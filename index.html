<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta name="description" content="输入任意带字幕的 YouTube 视频链接，实时流式生成排版清晰的中文深度对话文章，支持自然语言要求与章节级 5W1H 总结。" />
    <title>声稿 · YouTube 视频文章写作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23ad462d'/%3E%3Cpath d='M9 17h4v9H9zm6-7h4v20h-4zm6 4h4v15h-4zm6 4h4v7h-4z' fill='white'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip" href="#studio">跳到写作台</a>
    <header class="masthead">
      <div class="shell mast-inner">
        <a class="brand" href="#" aria-label="声稿首页">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>声稿</span><span class="brand-en" lang="en">Dialogue Press</span>
        </a>
        <nav aria-label="主导航">
          <a href="#studio" id="nav-studio" class="nav-item selected">写作台</a>
          <a class="repo" href="https://github.com/four1er/Vedio2Report" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看项目">
            <span data-icon="github"></span><span>GitHub</span><span data-icon="arrow-up-right"></span>
          </a>
        </nav>
      </div>
    </header>

    <main class="shell">
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro-copy">
          <p class="eyebrow"><span class="short-rule"></span>视频字幕写作台</p>
          <h1 id="intro-title">把视频对话<br />写成<span>中文长文。</span></h1>
          <p class="intro-description">提取 YouTube 字幕并经由 Gemini 流式整理为分章中文文章，支持自定义写作要求与每章一键 5W1H 深度总结。</p>
        </div>
        <img class="hero-art" src="/editorial-art.webp" alt="" width="544" height="320" fetchpriority="high" />
      </section>

      <div class="workspace" id="studio">
        <section class="editor panel" aria-labelledby="editor-title">
          <div class="card-heading">
            <div class="heading-group">
              <span class="heading-icon" data-icon="pen"></span>
              <h2 id="editor-title">生成中文文章</h2>
            </div>
            <span class="engine" lang="en"><span data-icon="sparkles"></span>Gemini Stream</span>
          </div>

          <form id="generate">
            <div class="label-row">
              <label for="video">YouTube 视频链接</label>
              <button id="fill" class="text-button" type="button">
                填入示例链接<span data-icon="corner"></span>
              </button>
            </div>
            <div class="input-wrap">
              <span data-icon="link"></span>
              <input
                id="video"
                name="url"
                type="url"
                placeholder="https://www.youtube.com/watch?v=…"
                required
                autocomplete="url"
                aria-describedby="url-hint"
                maxlength="2048"
              />
            </div>
            <p class="hint" id="url-hint">支持任意公开且带字幕的 YouTube 链接（自动经代理池读取，演示视频内置兜底字幕）。</p>

            <div class="label-row prompt-label">
              <label for="requirements">自然语言生成要求<span class="optional">选填</span></label>
            </div>
            <textarea
              id="requirements"
              name="requirements"
              maxlength="2000"
              placeholder="留空默认生成深度对话整理稿；也可指定任务类型、输出风格、目标受众或约束条件。"
            ></textarea>

            <div class="presets" aria-label="快捷要求示例">
              <span class="presets-label">快捷示例：</span>
              <button
                type="button"
                class="preset-chip"
                data-preset="面向刚入门 AI 的初学者，写成通俗易懂的科普指南，分为 3 个章节，保留原片中的关键类比和例子。"
              >初学者科普 · 3章</button>
              <button
                type="button"
                class="preset-chip"
                data-preset="为产品经理撰写一份精炼克制的商业分析简报，只聚焦商业模式、定价策略与成本结构，控制在 1200 字以内。"
              >PM 商业简报 · 限字数</button>
              <button
                type="button"
                class="preset-chip"
                data-preset="以投资人视角撰写深度观察，风格犀利直接，重点提炼核心判断、竞争格局与潜在风险。"
              >投资人视角 · 犀利风</button>
            </div>

            <div class="form-actions">
              <button type="submit" class="primary" id="submit">
                <span data-icon="pen"></span>
                <span id="submit-caption">开始流式生成</span>
                <span data-icon="arrow"></span>
              </button>
            </div>
            <p id="feedback" role="alert" hidden></p>
          </form>
        </section>
      </div>

      <section id="article" class="reader panel" hidden aria-labelledby="reader-title">
        <div class="reader-bar">
          <p class="eyebrow">
            <span class="small-dot" id="reader-pulse"></span>
            <span id="reader-mode"></span>
          </p>
          <div class="reader-actions">
            <button type="button" id="stop" class="subtle" hidden>停止生成</button>
            <button id="export-html" class="text-button" type="button" hidden>
              <span data-icon="download"></span><span>导出 HTML</span>
            </button>
            <button id="copy" class="text-button" type="button" hidden>
              <span data-icon="copy"></span><span id="copy-label">复制 Markdown</span>
            </button>
          </div>
        </div>

        <h2 id="reader-title" tabindex="-1">生成结果</h2>
        <p class="reader-source" id="reader-source"></p>
        <div class="reader-constraints" id="reader-constraints" hidden aria-label="生效的生成约束"></div>
        <details class="reader-toc" id="reader-toc" hidden>
          <summary id="toc-summary">章节目录</summary>
          <ol id="toc-list"></ol>
        </details>
        <p class="reader-status" id="reader-status" role="status"></p>
        <div id="body" class="prose"></div>
      </section>
    </main>

    <footer class="shell">
      <span>声稿 <em lang="en">Dialogue Press</em></span>
      <span>Cloudflare Workers · Gemini Streaming</span>
    </footer>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
