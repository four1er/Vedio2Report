name: Deploy Worker
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '验收用的有字幕 YouTube 视频链接（留空默认使用演示视频）'
        type: string
      requirements:
        description: '验收用的可选自然语言要求'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Deploy assets and Worker with secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          : "${GEMINI_API_KEY:?Missing GEMINI_API_KEY}"
          umask 077
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            const secrets = { GEMINI_API_KEY: process.env.GEMINI_API_KEY };
            if (process.env.PROXY_LIST?.trim()) secrets.PROXY_LIST = process.env.PROXY_LIST;
            if (process.env.GEMINI_MODEL?.trim()) secrets.GEMINI_MODEL = process.env.GEMINI_MODEL.trim();
            process.stdout.write(JSON.stringify(secrets));
          ' > "$secrets_file"
          WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/worker-deployment.jsonl" npx --no-install wrangler deploy --secrets-file "$secrets_file"
      - name: Verify deployed Worker (streaming + chapter 5W1H)
        timeout-minutes: 10
        env:
          ACCEPTANCE_VIDEO_URL: ${{ inputs.video_url }}
          ACCEPTANCE_REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          args=("$RUNNER_TEMP/worker-deployment.jsonl")
          if [[ -n "$ACCEPTANCE_VIDEO_URL" ]]; then args+=(--url "$ACCEPTANCE_VIDEO_URL"); fi
          if [[ -n "$ACCEPTANCE_REQUIREMENTS" ]]; then args+=(--requirements "$ACCEPTANCE_REQUIREMENTS"); fi
          node scripts/verify-deployment.mjs "${args[@]}"
