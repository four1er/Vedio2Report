name: Deploy Worker
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '验收用的有字幕 YouTube 链接'
        type: string
      video_id:
        description: '也可以填写视频 ID'
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Deploy assets and Worker with Gemini secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          : "${GEMINI_API_KEY:?Missing GEMINI_API_KEY}"
          umask 077
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'process.stdout.write(JSON.stringify({ GEMINI_API_KEY: process.env.GEMINI_API_KEY, SUPADATA_API_KEY: process.env.SUPADATA_API_KEY || undefined }))' > "$secrets_file"
          WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/worker-deployment.jsonl" npx --no-install wrangler deploy --secrets-file "$secrets_file"
      - name: Verify public page, streamed article and chapter summary
        timeout-minutes: 8
        env:
          ACCEPTANCE_VIDEO_URL: ${{ inputs.video_url }}
          ACCEPTANCE_VIDEO_ID: ${{ inputs.video_id }}
        run: |
          args=("$RUNNER_TEMP/worker-deployment.jsonl")
          if [[ -n "$ACCEPTANCE_VIDEO_URL" ]]; then args+=(--url "$ACCEPTANCE_VIDEO_URL"); fi
          node scripts/verify-deployment.mjs "${args[@]}"
